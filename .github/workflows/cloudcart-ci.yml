name: cloudcart-ci
on:
  workflow_dispatch:
  push:
    paths: ['cloudcart/**', '.github/workflows/cloudcart-ci.yml']
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - name: Versions
        run: java -version 2>&1 | tee versions.txt; mvn -v | tee -a versions.txt
      - name: Build and test
        working-directory: cloudcart
        run: mvn -B verify 2>&1 | tee ../build.log
      - name: Artifact checksum
        run: sha256sum cloudcart/target/cloudcart.war | tee cloudcart.war.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: cloudcart-build
          path: |
            cloudcart/target/cloudcart.war
            cloudcart/target/surefire-reports/
            build.log
            versions.txt
            cloudcart.war.sha256
  deploy-smoke:
    needs: build
    runs-on: ubuntu-24.04
    env:
      TOMCAT: 10.1.34
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/download-artifact@v4
        with: { name: cloudcart-build, path: dl }
      - name: Install Tomcat (checksum verified)
        run: |
          B=https://archive.apache.org/dist/tomcat/tomcat-10/v$TOMCAT/bin
          curl -fsSLO $B/apache-tomcat-$TOMCAT.tar.gz
          curl -fsSLO $B/apache-tomcat-$TOMCAT.tar.gz.sha512
          sha512sum -c apache-tomcat-$TOMCAT.tar.gz.sha512
          tar xzf apache-tomcat-$TOMCAT.tar.gz
      - name: Deploy WAR and start
        run: |
          cp dl/cloudcart/target/cloudcart.war apache-tomcat-$TOMCAT/webapps/
          apache-tomcat-$TOMCAT/bin/startup.sh
          for i in $(seq 1 40); do curl -fs localhost:8080/cloudcart/health && break; sleep 2; done
      - name: Runtime checks (real HTTP against Tomcat)
        run: |
          set -x
          B=localhost:8080/cloudcart
          curl -fs $B/health | grep -q '"status":"UP"'
          curl -fs $B/api/products | grep -q 'Mechanical keyboard'
          curl -fs $B/api/products/2 | grep -q 'USB-C hub'
          test "$(curl -s -o /dev/null -w '%{http_code}' $B/api/products/42)" = 404
          curl -fs -X POST -d '{"items":[{"productId":2,"quantity":2}]}' $B/api/orders | tee order.json
          grep -q '"totalCents":7000' order.json
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -d '{bad' $B/api/orders)" = 400
          echo "RUNTIME CHECKS PASSED" | tee runtime.txt
      - name: Collect logs
        if: always()
        run: mkdir -p out && cp apache-tomcat-$TOMCAT/logs/* out/ 2>/dev/null; cp runtime.txt out/ 2>/dev/null; true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: cloudcart-deploy-logs, path: out/ }
